[project]
name = "livepdf"
version = "0.1.0"
description = "Build, lint and test interactive PDFs (games, quizzes, teaching demos; form fields + JavaScript) for Chrome's PDF viewer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pypdf>=4"]
keywords = ["pdf", "acroform", "javascript", "pdfium", "testing", "games"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Multimedia :: Graphics",
]

[project.optional-dependencies]
render = ["pymupdf>=1.24"]
chrome = ["pymupdf>=1.24"]

[project.scripts]
livepdf = "livepdf.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pymupdf>=1.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livepdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["chrome: drives a real headless Chrome (slow, needs Chrome and Node 22+)"]
